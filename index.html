		body {

		/* -------- background layers: glyph rain (back) + node trellis (front) -------- */
		#id_rain_canvas,
		#id_bg_canvas {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
		}

		#id_rain_canvas {
			z-index: -2;
			background: radial-gradient(ellipse 120% 90% at 50% -10%, #151023 0%, #07050b 45%, #000000 100%);
		}

		#id_bg_canvas {
			z-index: -1;

		}

		/* -------- CRT overlay: scanlines + vignette + faint flicker -------- */
		#id_crt_overlay {
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 50;
			background:
				repeating-linear-gradient(0deg,
					rgba(0, 0, 0, 0.16) 0px,
					rgba(0, 0, 0, 0.16) 1px,
					transparent 1px,
					transparent 3px),
				radial-gradient(ellipse 100% 100% at 50% 50%,
					transparent 60%,
					rgba(1, 2, 8, 0.45) 100%);
			animation: crt-flicker 4s steps(60) infinite;
		}

		@keyframes crt-flicker {
			0%, 100% { opacity: 1; }
			92% { opacity: 1; }
			93% { opacity: .82; }
			94% { opacity: 1; }
			97% { opacity: .9; }
			98% { opacity: 1; }
		}

		/* -------- cursor -------- */
		@keyframes cursor-blink {
			0% {
				opacity: 0;
			}
		}

		#id_title {
			filter: drop-shadow(-2px 0 0 #111) drop-shadow(2px 0 0 #111) drop-shadow(0 -2px 0 #111) drop-shadow(0 2px 0 #111);
		}

		#id_title_cursor {
			display: inline-block;
			animation: cursor-blink 1.0s steps(2) infinite;
		}

		/* -------- title frame: corner brackets (top-left / bottom-right only) -------- */
		#id_title_frame {
			position: relative;
			padding: 1.25rem 1.25rem 1.25rem 1.25rem;
		}

		#id_title_frame::before,
		#id_title_frame::after {
			content: "";
			position: absolute;
			width: 22px;
			height: 22px;
			opacity: 0.7;
		}

		#id_title_frame::before {
			top: 0;
			left: 0;
			border-top: 1px solid #9775fa;
			border-left: 1px solid #9775fa;
		}

		#id_title_frame::after {
			bottom: 0;
			right: 0;
			border-bottom: 1px solid #9775fa;
			border-right: 1px solid #9775fa;
		}

		/* -------- CRT power-on entrance (replaces slide-in) -------- */
		.crt-in {
			animation: crt-in .9s steps(1) both;
		}

		.crt-in-late {
			animation: crt-in .9s steps(1) 1.6s both;
		}

		@keyframes crt-in {
			0% { opacity: 0; }
			12% { opacity: .85; }
			18% { opacity: .15; }
			30% { opacity: 1; }
			36% { opacity: .45; }
			48% { opacity: 1; }
			100% { opacity: 1; }
		}

		.fade-in {
			animation: fade-in 1.2s cubic-bezier(.39, .575, .565, 1.0) 2.2s both;
		}

		@keyframes fade-in {
			0% { opacity: 0; }
			100% { opacity: 1; }
		}

		/* -------- RGB-split glitch, toggled at random intervals via JS -------- */
		.glitching {
			animation: rgb-split .22s steps(2) 1;
		}

		@keyframes rgb-split {
			0% {
				text-shadow: 2px 0 rgba(255, 0, 200, 0.75), -2px 0 rgba(0, 220, 255, 0.75);
				transform: translateX(1px);
			}
			50% {

				transform: translateX(-1px);
			}
			100% {

				transform: none;
			}
		}

		/* -------- boot line above the title -------- */

		/* -------- respect reduced motion: everything static -------- */

			.crt-in,
			.crt-in-late,
			.fade-in,

				animation: none !important;
			}

			.crt-in,
			.crt-in-late,
			.fade-in {

	<script>
		// shared motion preference

	<script>
		// GLYPH RAIN: a very dim stream of katakana/digits behind the trellis —
		// the "sea" the title dives into. Kept at low alpha so it reads as
		// texture, not as a Matrix cosplay.
		(function () {
			var canvas = document.getElementById('id_rain_canvas');
			if (!canvas || !canvas.getContext) return;
			var ctx = canvas.getContext('2d');
			var dpr = Math.min(window.devicePixelRatio || 1, 2);

			var GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789';
			var COL_W = 26;
			var ROW_H = 22;
			var TRAIL = 9;
			var width, height, cols, rows, grid, heads, frame;

			function randomGlyph() {
				return GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
			}

			function resize() {
				width = window.innerWidth;
				height = window.innerHeight;
				canvas.width = width * dpr;
				canvas.height = height * dpr;
				canvas.style.width = width + 'px';
				canvas.style.height = height + 'px';
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

				cols = Math.ceil(width / COL_W);
				rows = Math.ceil(height / ROW_H) + TRAIL;
				frame = 0;

				grid = [];
				heads = [];
				for (var c = 0; c < cols; c++) {
					var col = [];
					for (var r = 0; r < rows; r++) col.push(randomGlyph());
					grid.push(col);
					heads.push({
						row: Math.floor(Math.random() * rows),
						every: 4 + Math.floor(Math.random() * 6) // frames per step; differs per column
					});
				}
			}

			function draw() {
				ctx.clearRect(0, 0, width, height);
				ctx.font = '14px "Courier New", Courier, monospace';
				ctx.textBaseline = 'top';

				for (var c = 0; c < cols; c++) {
					var head = heads[c];
					for (var k = 0; k < TRAIL; k++) {
						var r = head.row - k;
						if (r < 0) r += rows;
						var alpha = (k === 0 ? 0.13 : 0.10) * (1 - k / TRAIL);
						if (alpha <= 0.01) continue;
						ctx.fillStyle = 'rgba(177,151,252,' + alpha + ')';
						ctx.fillText(grid[c][r], c * COL_W + 4, r * ROW_H);
					}
				}
			}

			function step() {
				frame++;
				for (var c = 0; c < cols; c++) {
					var head = heads[c];
					if (frame % head.every === 0) {
						head.row = (head.row + 1) % rows;
						grid[c][head.row] = randomGlyph(); // fresh glyph at the new head
					}
				}
			}

			function loop() {
				step();
				if (frame % 2 === 0) draw(); // half-rate draw: stepping feel + cheaper
				requestAnimationFrame(loop);
			}

			window.addEventListener('resize', resize);
			resize();
			draw();
			if (!REDUCE_MOTION) requestAnimationFrame(loop);
		})();
	</script>

	<script>
		// VINEYARD: growth expressed as actual growth — new buds keep sprouting
		// across the trellis over time, each with its own fixed size (1x-2.5x),
		// and connect to nearby buds with tendrils as they appear. Older buds
		// retire gracefully to make room, so the field keeps growing forever.
		// (Nodes/edges double as the site's CTI link-analysis motif; signals
		// occasionally pulse along the tendrils, cyberbrain-network style.)
		(function () {
			var canvas = document.getElementById('id_bg_canvas');
			if (!canvas || !canvas.getContext) return;
			var ctx = canvas.getContext('2d');
			var dpr = Math.min(window.devicePixelRatio || 1, 2);
			var reduceMotion = REDUCE_MOTION;

			var NODE_RGB = '177,151,252'; // matches the site's accent, Mantine violet-3 (#b197fc)
			var LINK_DIST = 260;
			var BASE_SIZE = 2;      // "1x" reference bud size, in px
			var GROW_FRAMES = 50;   // time for a new bud to sprout to full size
			var FADE_FRAMES = 50;   // time for a retiring bud to fade out
			var width, height, nodes, maxNodes, frame, spawnAt;
			var pulses, pulseAt;
			var telemetryNodes = document.getElementById('id_telemetry_nodes');

			function makeNode() {
				return {
					x: Math.random() * width,
					y: Math.random() * height,
					vx: (Math.random() - 0.5) * 0.28,
					vy: (Math.random() - 0.5) * 0.2 - 0.05,
					s: BASE_SIZE * (1 + Math.random() * 1.5), // fixed size, 1x-2.5x — differs per bud
					a: Math.random() * 0.55 + 0.25,           // fixed opacity — differs per bud
					born: frame,
					dying: false,
					diedAt: 0
				};
			}

			function resize() {
				width = window.innerWidth;
				height = window.innerHeight;
				canvas.width = width * dpr;
				canvas.height = height * dpr;
				canvas.style.width = width + 'px';
				canvas.style.height = height + 'px';
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				ctx.imageSmoothingEnabled = false;

				maxNodes = Math.min(140, Math.max(45, Math.round((width * height) / 14000)));
				frame = 0;
				spawnAt = 0;
				pulseAt = 60;
				nodes = [];
				pulses = [];

				// seed part of the field so it isn't empty on load; the rest sprouts in over time.
				// (with reduced motion, seed the whole field at once, fully grown, and never animate.)
				var seedCount = reduceMotion ? maxNodes : Math.round(maxNodes * 0.55);
				for (var i = 0; i < seedCount; i++) {
					var n = makeNode();
					n.born = -GROW_FRAMES; // already fully grown
					nodes.push(n);
				}
			}

			function scaleOf(n) {
				if (n.dying) {
					return Math.max(0, 1 - (frame - n.diedAt) / FADE_FRAMES);
				}
				return Math.min(1, Math.max(0, (frame - n.born) / GROW_FRAMES));
			}

			function spawnPulse() {
				// pick a random grown node, then a random neighbor within link range
				if (nodes.length < 2) return;
				var a = nodes[Math.floor(Math.random() * nodes.length)];
				if (scaleOf(a) < 1) return;
				var candidates = [];
				for (var i = 0; i < nodes.length; i++) {
					var b = nodes[i];
					if (b === a || scaleOf(b) < 1) continue;
					var dx = a.x - b.x, dy = a.y - b.y;
					if (dx * dx + dy * dy < LINK_DIST * LINK_DIST) candidates.push(b);
				}
				if (!candidates.length) return;
				pulses.push({
					a: a,
					b: candidates[Math.floor(Math.random() * candidates.length)],
					t: 0
				});
			}

			function step() {
				frame++;

				for (var i = nodes.length - 1; i >= 0; i--) {
					var n = nodes[i];
					n.x += n.vx;
					n.y += n.vy;
					if (n.x < -20) n.x = width + 20;
					if (n.x > width + 20) n.x = -20;
					if (n.y < -20) n.y = height + 20;
					if (n.y > height + 20) n.y = -20;
					if (n.dying && scaleOf(n) <= 0) nodes.splice(i, 1);
				}

				// periodically sprout a new bud, retiring the oldest once the trellis is full
				if (frame >= spawnAt) {
					if (nodes.length < maxNodes) {
						nodes.push(makeNode());
					} else {
						var oldest = null;
						for (var k = 0; k < nodes.length; k++) {
							if (!nodes[k].dying && (oldest === null || nodes[k].born < oldest.born)) oldest = nodes[k];
						}
						if (oldest) { oldest.dying = true; oldest.diedAt = frame; }
						nodes.push(makeNode());
					}
					spawnAt = frame + 25 + Math.random() * 35;
				}

				// occasionally send a signal along a tendril
				if (frame >= pulseAt) {
					spawnPulse();
					pulseAt = frame + 70 + Math.random() * 110;
				}
				for (var p = pulses.length - 1; p >= 0; p--) {
					pulses[p].t += 0.025;
					if (pulses[p].t >= 1 || scaleOf(pulses[p].a) <= 0 || scaleOf(pulses[p].b) <= 0) {
						pulses.splice(p, 1);
					}
				}

				if (telemetryNodes && frame % 30 === 0) {
					telemetryNodes.textContent = String(nodes.length).padStart(3, '0');
				}
			}

			function drawCross(x, y, s, style) {
				// pixel cross (+) marker instead of a plain square — HUD-ish
				var t = Math.max(1, Math.round(s / 3));
				var len = Math.max(2, Math.round(s));
				ctx.fillStyle = style;
				ctx.fillRect(Math.round(x - len / 2), Math.round(y - t / 2), len, t);
				ctx.fillRect(Math.round(x - t / 2), Math.round(y - len / 2), t, len);
			}

			function draw() {
				ctx.clearRect(0, 0, width, height);

				// tendrils connecting nearby buds — they grow in and fade out with their buds
				for (var i = 0; i < nodes.length; i++) {
					for (var j = i + 1; j < nodes.length; j++) {
						var a = nodes[i], b = nodes[j];
						var dx = a.x - b.x, dy = a.y - b.y;
						var dist = Math.sqrt(dx * dx + dy * dy);
						if (dist < LINK_DIST) {
							var linkScale = Math.min(scaleOf(a), scaleOf(b));
							if (linkScale <= 0) continue;
							var alpha = 0.32 * (1 - dist / LINK_DIST) * linkScale;
							ctx.strokeStyle = 'rgba(' + NODE_RGB + ',' + alpha + ')';
							ctx.lineWidth = 1.4;
							ctx.beginPath();
							ctx.moveTo(a.x, a.y);
							ctx.lineTo(b.x, b.y);
							ctx.stroke();
						}
					}
				}

				// signals travelling along tendrils
				for (var pp = 0; pp < pulses.length; pp++) {
					var pu = pulses[pp];
					var px = pu.a.x + (pu.b.x - pu.a.x) * pu.t;
					var py = pu.a.y + (pu.b.y - pu.a.y) * pu.t;
					var fade = Math.sin(pu.t * Math.PI); // ease in-out brightness
					ctx.fillStyle = 'rgba(' + NODE_RGB + ',' + (0.9 * fade) + ')';
					ctx.fillRect(Math.round(px) - 1, Math.round(py) - 1, 3, 3);
				}

				// buds — each has its own fixed size (1x-2.5x) and opacity, no pulsing once grown
				for (var kk = 0; kk < nodes.length; kk++) {
					var nn = nodes[kk];
					var sc = scaleOf(nn);
					if (sc <= 0) continue;
					var s = nn.s * sc;
					drawCross(nn.x, nn.y, s * 1.6, 'rgba(' + NODE_RGB + ',' + (nn.a * sc) + ')');
				}
			}

			function loop() {
				step();
				draw();
				requestAnimationFrame(loop);
			}

			window.addEventListener('resize', resize);
			resize();
			draw();
			if (telemetryNodes) telemetryNodes.textContent = String(nodes.length).padStart(3, '0');
			if (!reduceMotion) {
				requestAnimationFrame(loop);
			}
		})();
	</script>

	<script>
		// BOOT SEQUENCE + TITLE DECODE + OCCASIONAL GLITCH
		(function () {
			var bootline = document.getElementById('id_bootline');
			var titleText = document.getElementById('id_title_text');
			var title = document.getElementById('id_title');
			if (!bootline || !titleText || !title) return;

			var BOOT = '> uplink established :: diving...';
			var FINAL = titleText.textContent;
			var SCRAMBLE = 'アイウエオカキクケコサシスセソ01>/\\|=+*#';

			function randomChar() {
				return SCRAMBLE.charAt(Math.floor(Math.random() * SCRAMBLE.length));
			}

			// occasional RGB-split glitch on the title, forever
			function scheduleGlitch() {
				setTimeout(function () {
					title.classList.add('glitching');
					setTimeout(function () { title.classList.remove('glitching'); }, 240);
					scheduleGlitch();
				}, 3500 + Math.random() * 6500);
			}

			if (REDUCE_MOTION) {
				bootline.textContent = BOOT;
				return; // static text, no typing / decode / glitch
			}

			// 1) type the boot line
			titleText.textContent = '';
			var bi = 0;
			var typeTimer = setInterval(function () {
				bi++;
				bootline.textContent = BOOT.slice(0, bi);
				if (bi >= BOOT.length) {
					clearInterval(typeTimer);
					setTimeout(decodeTitle, 250);
				}
			}, 28);

			// 2) decode the title: characters lock into place left-to-right,
			//    unresolved ones churn through scramble glyphs
			function decodeTitle() {
				var locked = 0;
				var total = FINAL.length;
				var decodeTimer = setInterval(function () {
					locked += 1 + Math.floor(Math.random() * 2);
					if (locked >= total) {
						titleText.textContent = FINAL;
						clearInterval(decodeTimer);
						scheduleGlitch();
						return;
					}
					var out = FINAL.slice(0, locked);
					for (var i = locked; i < total; i++) {
						out += FINAL.charAt(i) === ' ' ? ' ' : randomChar();
					}
					titleText.textContent = out;
				}, 34);
			}
		})();
	</script>
</body>
