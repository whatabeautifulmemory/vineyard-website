	<script>
		// Animated background: a slowly drifting particle network,
		// evoking both a CTI link-analysis graph and the "sea" of the tagline.
		(function () {
			var canvas = document.getElementById('id_bg_canvas');
			if (!canvas || !canvas.getContext) return;
			var ctx = canvas.getContext('2d');
			var dpr = Math.min(window.devicePixelRatio || 1, 2);
			var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

			var NODE_RGB = '134,239,172'; // matches the site's green-200 accent
			var LINK_DIST = 260;
			var width, height, nodes;

			function resize() {
				width = window.innerWidth;
				height = window.innerHeight;
				canvas.width = width * dpr;
				canvas.height = height * dpr;
				canvas.style.width = width + 'px';
				canvas.style.height = height + 'px';
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				ctx.imageSmoothingEnabled = false;

				var count = Math.min(140, Math.max(45, Math.round((width * height) / 14000)));
				nodes = [];
				for (var i = 0; i < count; i++) {
					nodes.push({
						x: Math.random() * width,
						y: Math.random() * height,
						vx: (Math.random() - 0.5) * 0.18,
						vy: (Math.random() - 0.5) * 0.12 - 0.03,
						s: Math.random() * 2.5 + 2, // square side length, in px — pixel-art feel
						a: Math.random() * 0.55 + 0.25 // each node keeps its own opacity
					});
				}
			}

			function step() {
				for (var i = 0; i < nodes.length; i++) {
					var n = nodes[i];
					n.x += n.vx;
					n.y += n.vy;
					if (n.x < -20) n.x = width + 20;
					if (n.x > width + 20) n.x = -20;
					if (n.y < -20) n.y = height + 20;
					if (n.y > height + 20) n.y = -20;
				}
			}

			function draw() {
				ctx.clearRect(0, 0, width, height);

				for (var i = 0; i < nodes.length; i++) {
					for (var j = i + 1; j < nodes.length; j++) {
						var a = nodes[i], b = nodes[j];
						var dx = a.x - b.x, dy = a.y - b.y;
						var dist = Math.sqrt(dx * dx + dy * dy);
						if (dist < LINK_DIST) {
							ctx.strokeStyle = 'rgba(' + NODE_RGB + ',' + (0.32 * (1 - dist / LINK_DIST)) + ')';
							ctx.lineWidth = 1.4;
							ctx.beginPath();
							ctx.moveTo(a.x, a.y);
							ctx.lineTo(b.x, b.y);
							ctx.stroke();
						}
					}
				}

				for (var k = 0; k < nodes.length; k++) {
					var n = nodes[k];
					ctx.fillStyle = 'rgba(' + NODE_RGB + ',' + n.a + ')';
					var half = n.s / 2;
					ctx.fillRect(Math.round(n.x - half), Math.round(n.y - half), Math.round(n.s), Math.round(n.s));
				}
			}

			function loop() {
				step();
				draw();
				requestAnimationFrame(loop);
			}

			window.addEventListener('resize', resize);
			resize();
			draw();
			if (!reduceMotion) {
				requestAnimationFrame(loop);
			}
		})();
	</script>
