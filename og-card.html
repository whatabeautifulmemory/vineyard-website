<!DOCTYPE html>
<!--
  Source of og.png — the link-preview card served for vineyard.run, app.vineyard.run and
  docs.vineyard.run. Not linked from anywhere and never served to a browser; it exists so the
  card is regenerable instead of an orphan binary.

  Regenerate (macOS, Playwright's bundled headless shell):

    ~/Library/Caches/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-mac-arm64/chrome-headless-shell \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=og.png "file://$PWD/og-card.html"

  1200x630 at 2x = 2400x1260, which is what the og:image:width/height in index.html declare.
  --virtual-time-budget is load-bearing: the NeoDunggeunmo webfont comes from a CDN, and without
  it the shell screenshots the fallback monospace before the font arrives.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@main/neodgm_code/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'NeoDunggeunmo Code', 'Courier New', monospace; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #010405;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  /* the site's scanline/grid texture, at card scale */
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(151, 117, 250, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(151, 117, 250, 0.055) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* violet glow off the lower right, so the block of text has somewhere to sit */
  body::after {
    content: ''; position: absolute;
    right: -180px; bottom: -240px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.28) 0%, rgba(1, 4, 5, 0) 68%);
  }
  .card { position: relative; z-index: 1; height: 100%; padding: 74px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 62px; height: 62px; }
  .brand .word { font-size: 46px; color: #b197fc; letter-spacing: 2px; transform: translateY(3px); }
  .spacer { flex: 1; }
  .kicker { font-size: 22px; color: #9775fa; letter-spacing: 3px; margin-bottom: 18px; }
  h1 { font-size: 62px; line-height: 1.16; color: #e6d6a3; font-weight: normal; letter-spacing: 1px; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.5; color: #d8ccff; max-width: 930px; }
  .foot { margin-top: 40px; font-size: 21px; color: #8672d6; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <g stroke-linejoin="round">
          <line x1="22" y1="5" x2="22" y2="2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="22" y1="2" x2="18" y2="6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14.6" y1="3.97" x2="20.03" y2="9.4" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="14.6" y1="3.97" x2="7.18" y2="5.95" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="7.18" y1="5.95" x2="3.2" y2="20.8" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="20.03" y1="9.4" x2="3.2" y2="20.8" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
          <rect x="15.95" y="14.72" width="4.2" height="4.2" rx="1" fill="#ffffff"/>
          <rect x="8.52" y="16.7" width="4.2" height="4.2" rx="1" fill="#ffffff"/>
          <rect x="1.1" y="18.7" width="4.2" height="4.2" rx="1" fill="#ffffff"/>
        </g>
      </svg>
      <span class="word">VINEYARD</span>
    </div>

    <div class="spacer"></div>

    <div class="kicker">&gt; OPEN CTI ANALYSIS PLATFORM</div>
    <h1>DIVE INTO THE SEA OF<br>CYBER THREAT INTELLIGENCE</h1>
    <p>Reveal hidden relationships and turn fragmented threat intelligence into actionable insight.</p>
    <div class="foot">VINEYARD.RUN</div>
  </div>
</body>
</html>
